<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | Stackly</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Theme CSS for buttons -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            background-color: #f8fafc !important; /* var(--bg-light) */
            color: #0f172a !important; /* var(--text-main) */
            margin: 0;
            padding: 0;
            overflow: hidden; /* Lock scroll */
        }

        /* Ambient Animated Mesh Background - Light Theme */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #f8fafc;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: floatOrb 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 60vw; height: 60vw;
            background: #2563eb; /* Primary */
            top: -20%; left: -10%;
            animation-duration: 25s;
        }

        .orb-2 {
            width: 50vw; height: 50vw;
            background: #f43f5e; /* Accent Rose */
            bottom: -10%; right: -10%;
            animation-duration: 20s;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 40vw; height: 40vw;
            background: #0ea5e9; /* Secondary Sky */
            top: 40%; left: 40%;
            animation-duration: 30s;
            animation-delay: -10s;
            opacity: 0.3;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(10%, 15%) scale(1.1); }
            66% { transform: translate(-10%, 5%) scale(0.9); }
            100% { transform: translate(5%, -15%) scale(1.05); }
        }

        /* Light Glass Container matching style.css */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 24px;
            padding: 4rem 3rem;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            position: relative;
            z-index: 10;
        }

        /* Hollow Text Effect - Light Theme */
        .hollow-text {
            font-size: 10rem;
            font-weight: 800;
            color: transparent;
            -webkit-text-stroke: 3px #2563eb;
            line-height: 1;
            margin-bottom: 0;
            letter-spacing: -5px;
            position: relative;
            display: inline-block;
        }

        /* Glitch effect on hover */
        .hollow-text:hover {
            color: #2563eb;
            -webkit-text-stroke: 0px;
            text-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
        }

        .subtitle-text {
            font-size: 2rem;
            font-weight: 700;
            margin-top: -10px;
            margin-bottom: 1.5rem;
            color: #0f172a;
        }

        .desc-text {
            color: #64748b; /* var(--text-muted) */
            font-size: 1.1rem;
            max-width: 450px;
            margin: 0 auto 2.5rem auto;
            line-height: 1.6;
        }

        /* Floating Element inside card */
        .car-icon {
            font-size: 2.5rem;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #f43f5e);
            width: 80px;
            height: 80px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 1rem;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        /* Floating Element inside card */
        .car-icon {
            font-size: 2.5rem;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #f43f5e);
            width: 80px;
            height: 80px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 1rem;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        /* Ultra Responsive */
        @media (max-width: 576px) {
            .glass-panel { padding: 3rem 1.5rem; border-radius: 24px; margin: 0 1rem; }
            .hollow-text { font-size: 6rem; letter-spacing: -2px; }
            .subtitle-text { font-size: 1.5rem; }
            .desc-text { font-size: 0.95rem; }
            .orb { filter: blur(60px); }
        }

        /* 320px specific */
        @media (max-width: 360px) {
            .glass-panel { padding: 2rem 1rem; }
            .hollow-text { font-size: 4.5rem; }
            .subtitle-text { font-size: 1.3rem; }
            .car-icon { width: 60px; height: 60px; font-size: 1.8rem; margin-bottom: 0.5rem; }
            .btn-group-custom { flex-direction: column !important; width: 100%; gap: 10px !important; }
            .btn-premium, .btn-premium-outline { width: 100%; padding: 0.8rem 1rem; font-size: 0.9rem; }
            .desc-text { margin-bottom: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Animated Gradient Mesh Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="vh-100 d-flex align-items-center justify-content-center position-relative w-100">
        <div class="container text-center d-flex justify-content-center">
            
            <div class="glass-panel text-center">
                <div class="car-icon">
                    <i class="fas fa-map-signs"></i>
                </div>
                
                <h1 class="hollow-text">404</h1>
                <h2 class="subtitle-text">Destination Unknown</h2>
                
                <p class="desc-text">
                    The road ends here. The page you requested doesn't exist, was renamed, or is temporarily unavailable. Let's get you back.
                </p>
                
                <div class="d-flex justify-content-center gap-3 btn-group-custom">
                    <a href="index.html" class="btn btn-custom-primary text-decoration-none d-flex align-items-center justify-content-center">
                        <i class="fas fa-home me-2"></i> Back to Home
                    </a>
                    <button onclick="window.history.back()" class="btn btn-custom-outline d-flex align-items-center justify-content-center">
                        <i class="fas fa-arrow-left me-2"></i> Go Back
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
