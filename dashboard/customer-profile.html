<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; padding: 1rem; }
        @media (min-width: 768px) { body { padding: 1.5rem; } }
        /* Ultra responsive tweaks down to 320px */
        @media (max-width: 360px) {
            body { padding: 0.5rem; }
            .panel, .stat-card { padding: 1rem; }
            .stat-card h2 { font-size: 1.3rem; }
            h3, h4, h5 { font-size: 1.1rem !important; }
            .btn { font-size: 0.8rem; padding: 0.4rem 0.8rem !important; }
            .icon-box { width: 40px; height: 40px; }
            .table-responsive { font-size: 0.8rem; }
            .d-flex.justify-content-between.align-items-center.mb-4 { flex-direction: column; align-items: flex-start !important; gap: 10px; }
        }
        .stat-card { background: #fff; border-radius: 16px; padding: 1.5rem; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: transform 0.3s; height: 100%; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.05); }
        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .panel { background: #fff; border-radius: 16px; padding: 1.5rem; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 1.5rem; }
        .badge-soft-success { background-color: rgba(16, 185, 129, 0.1); color: #10b981; }
        .badge-soft-warning { background-color: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .badge-soft-danger { background-color: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .badge-soft-primary { background-color: rgba(37, 99, 235, 0.1); color: #2563eb; }
        .vehicle-img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 1rem; }
        
        /* Custom scrollbar for table */
        .table-responsive::-webkit-scrollbar { height: 6px; }
        .table-responsive::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark mb-0">Profile Settings</h4>
        <button class="btn btn-custom-primary rounded-pill px-4 fw-bold shadow-sm" onclick="window.location.href='../404.html'"><i class="fas fa-save me-2"></i> Save</button>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="panel text-center">
                <div class="position-relative d-inline-block mb-3">
                    <img src="../assets/images/img_22.webp" class="rounded-circle shadow-sm" alt="Avatar">
                    <button class="btn btn-sm btn-custom-secondary border rounded-circle position-absolute bottom-0 end-0 shadow-sm" style="width: 32px; height: 32px;" onclick="window.location.href='../404.html'"><i class="fas fa-camera"></i></button>
                </div>
                <h5 class="fw-bold mb-1">John Doe</h5>
                <p class="text-muted small mb-3">Premium Member since 2024</p>
                <div class="d-flex justify-content-center gap-2">
                    <span class="badge badge-soft-primary px-3 py-2 rounded-pill">Customer</span>
                    <span class="badge badge-soft-warning px-3 py-2 rounded-pill"><i class="fas fa-star me-1"></i> 1,250 Pts</span>
                </div>
            </div>
            
            <div class="panel mt-4">
                <h6 class="fw-bold mb-3">Account Security</h6>
                <button class="btn btn-outline-secondary w-100 rounded-pill fw-bold mb-2" onclick="window.location.href='../404.html'"><i class="fas fa-lock me-2"></i> Change Password</button>
                <button class="btn btn-outline-secondary w-100 rounded-pill fw-bold" onclick="window.location.href='../404.html'"><i class="fas fa-shield-alt me-2"></i> Two-Factor Auth</button>
            </div>
        </div>
        
        <div class="col-lg-8">
            <div class="panel">
                <h5 class="fw-bold mb-4">Personal Information</h5>
                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted text-uppercase mb-2">First Name</label>
                            <input type="text" class="form-control bg-light border-0 px-3 py-2 rounded-3" value="John">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted text-uppercase mb-2">Last Name</label>
                            <input type="text" class="form-control bg-light border-0 px-3 py-2 rounded-3" value="Doe">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted text-uppercase mb-2">Email Address</label>
                            <input type="email" class="form-control bg-light border-0 px-3 py-2 rounded-3" value="john.doe@stackly.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted text-uppercase mb-2">Phone Number</label>
                            <input type="tel" class="form-control bg-light border-0 px-3 py-2 rounded-3" value="+1 (555) 123-4567">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold small text-muted text-uppercase mb-2">Home Address</label>
                            <input type="text" class="form-control bg-light border-0 px-3 py-2 rounded-3 mb-2" value="123 Main Street, Apt 4B">
                            <div class="row g-2">
                                <div class="col-md-5"><input type="text" class="form-control bg-light border-0 px-3 py-2 rounded-3" value="New York"></div>
                                <div class="col-md-4"><input type="text" class="form-control bg-light border-0 px-3 py-2 rounded-3" value="NY"></div>
                                <div class="col-md-3"><input type="text" class="form-control bg-light border-0 px-3 py-2 rounded-3" value="10001"></div>
                            </div>
                        </div>
                    </div>
                </form>
                
                <h5 class="fw-bold mb-4 mt-5">Notification Preferences</h5>
                <div class="card border-0 bg-light rounded-4 p-3 mb-2">
                    <div class="form-check form-switch d-flex justify-content-between align-items-center mb-0 px-0">
                        <div>
                            <label class="form-check-label fw-bold d-block mb-1">Service Reminders</label>
                            <small class="text-muted">Get notified when your vehicle is due for service.</small>
                        </div>
                        <input class="form-check-input" type="checkbox" role="switch" checked style="width: 40px; height: 20px;">
                    </div>
                </div>
                <div class="card border-0 bg-light rounded-4 p-3 mb-2">
                    <div class="form-check form-switch d-flex justify-content-between align-items-center mb-0 px-0">
                        <div>
                            <label class="form-check-label fw-bold d-block mb-1">Promotions & Offers</label>
                            <small class="text-muted">Receive exclusive deals from partnered garages.</small>
                        </div>
                        <input class="form-check-input" type="checkbox" role="switch" style="width: 40px; height: 20px;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
