<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; padding: 1rem; }
        @media (min-width: 768px) { body { padding: 1.5rem; } }
        /* Ultra responsive tweaks down to 320px */
        @media (max-width: 360px) {
            body { padding: 0.5rem; }
            .panel, .stat-card { padding: 1rem; }
            .stat-card h2 { font-size: 1.3rem; }
            h3, h4, h5 { font-size: 1.1rem !important; }
            .btn { font-size: 0.8rem; padding: 0.4rem 0.8rem !important; }
            .icon-box { width: 40px; height: 40px; }
            .table-responsive { font-size: 0.8rem; }
            .d-flex.justify-content-between.align-items-center.mb-4 { flex-direction: column; align-items: flex-start !important; gap: 10px; }
        }
        .stat-card { background: #fff; border-radius: 16px; padding: 1.5rem; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: transform 0.3s; height: 100%; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.05); }
        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .panel { background: #fff; border-radius: 16px; padding: 1.5rem; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 1.5rem; }
        .badge-soft-success { background-color: rgba(16, 185, 129, 0.1); color: #10b981; }
        .badge-soft-warning { background-color: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .badge-soft-danger { background-color: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .badge-soft-primary { background-color: rgba(37, 99, 235, 0.1); color: #2563eb; }
        .vehicle-img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 1rem; }
        
        /* Custom scrollbar for table */
        .table-responsive::-webkit-scrollbar { height: 6px; }
        .table-responsive::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark mb-0">My Garage</h4>
        <button class="btn btn-custom-primary rounded-pill px-4 fw-bold shadow-sm"><i class="fas fa-plus me-2"></i> Add Vehicle</button>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="panel h-100 p-0 overflow-hidden border-0">
                <div class="p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">2019 Toyota Camry</h5>
                        <span class="badge badge-soft-success px-3 py-1 rounded-pill"><i class="fas fa-check-circle me-1"></i> Good Health</span>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <small class="text-muted d-block text-uppercase fw-bold">License Plate</small>
                            <span class="fw-bold">ABC-1234</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block text-uppercase fw-bold">Mileage</small>
                            <span class="fw-bold">45,200 mi</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block text-uppercase fw-bold">Engine</small>
                            <span class="fw-bold">2.5L 4-Cyl</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block text-uppercase fw-bold">Next Service</small>
                            <span class="fw-bold text-warning">Oct 15, 2026</span>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-custom-secondary flex-fill fw-bold text-primary">Service History</button>
                        <button class="btn btn-custom-outline px-3" title="Remove Vehicle"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="panel h-100 p-0 overflow-hidden border-0">
                <div class="p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">2021 Ford F-150</h5>
                        <span class="badge badge-soft-warning px-3 py-1 rounded-pill"><i class="fas fa-exclamation-circle me-1"></i> Needs Attention</span>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <small class="text-muted d-block text-uppercase fw-bold">License Plate</small>
                            <span class="fw-bold">TRK-9988</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block text-uppercase fw-bold">Mileage</small>
                            <span class="fw-bold">28,500 mi</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block text-uppercase fw-bold">Engine</small>
                            <span class="fw-bold">3.5L V6</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block text-uppercase fw-bold">Tire Pressure</small>
                            <span class="fw-bold text-danger">Low (Rear Left)</span>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-custom-secondary flex-fill fw-bold text-primary">Service History</button>
                        <button class="btn btn-custom-outline px-3" title="Remove Vehicle"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="panel">
        <h5 class="fw-bold mb-4">Mileage Accumulation Trend</h5>
        <div id="mileageChart"></div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var options = {
                series: [
                    { name: 'Toyota Camry', data: [40000, 41200, 42500, 43800, 45200] },
                    { name: 'Ford F-150', data: [22000, 23500, 25100, 26800, 28500] }
                ],
                chart: { type: 'line', height: 300, toolbar: { show: false }, fontFamily: 'Plus Jakarta Sans, sans-serif' },
                colors: ['#2563eb', '#f59e0b'],
                stroke: { width: 3, curve: 'smooth' },
                xaxis: { categories: ['Jan', 'Mar', 'May', 'Jul', 'Sep'], axisBorder: { show: false } },
                grid: { borderColor: '#f1f5f9', strokeDashArray: 4 },
                legend: { position: 'top' }
            };
            var chart = new ApexCharts(document.querySelector("#mileageChart"), options);
            chart.render();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
