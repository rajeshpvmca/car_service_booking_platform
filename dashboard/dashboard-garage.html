<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garage Dashboard | Stackly Platform</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" />
    <style>
        :root {
            --sidebar-width: 280px;
            --header-height: 70px;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            background-color: var(--bg-light);
        }
        
        /* Premium Sidebar */
        .dash-sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: linear-gradient(180deg, var(--primary-color) 0%, #1e3a8a 100%);
            z-index: 1050;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.1);
        }
        
        .sidebar-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-nav {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem 1rem;
        }
        
        .nav-item-dash {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .nav-item-dash:hover, .nav-item-dash.active {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: translateX(5px);
        }
        
        .nav-item-dash.active {
            font-weight: 700;
            border-left: 4px solid #fff;
        }
        
        /* Main Content */
        .dash-main {
            margin-left: var(--sidebar-width);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease;
            background-color: #f8fafc;
        }
        
        .dash-header {
            height: var(--header-height);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        
        #dashFrame {
            flex-grow: 1;
            border: none;
            width: 100%;
            background-color: transparent;
        }
        
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15,23,42,0.5);
            backdrop-filter: blur(4px);
            z-index: 1040;
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        
        @media (max-width: 991.98px) {
            .dash-sidebar { transform: translateX(-100%); }
            .dash-sidebar.active { transform: translateX(0); }
            .dash-main { margin-left: 0; }
            .dash-header { padding: 0 1rem; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="dash-sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="d-flex align-items-center text-white text-decoration-none">
                <i class="fas fa-car fa-lg me-2"></i>
                <h4 class="mb-0 fw-bold">Stackly</h4>
            </a>
        </div>
        <div class="sidebar-nav">
            <div class="small text-uppercase fw-bold mb-3 ms-3" style="color: rgba(255,255,255,0.4); letter-spacing: 1px;">Menu</div>
            
            
            <a href="#" class="nav-item-dash active" data-target="garage-overview.html">
                <i class="fas fa-chart-line"></i>
                <span>Garage Overview</span>
            </a>
            
            <a href="#" class="nav-item-dash " data-target="garage-appointments.html">
                <i class="fas fa-tools"></i>
                <span>Appointments</span>
            </a>
            
            <a href="#" class="nav-item-dash " data-target="garage-inventory.html">
                <i class="fas fa-boxes"></i>
                <span>Parts Inventory</span>
            </a>
            
            <a href="#" class="nav-item-dash " data-target="garage-earnings.html">
                <i class="fas fa-wallet"></i>
                <span>Earnings & Payouts</span>
            </a>
            
            <a href="#" class="nav-item-dash " data-target="garage-profile.html">
                <i class="fas fa-store"></i>
                <span>Garage Profile</span>
            </a>
            
            
            <hr style="border-color: rgba(255,255,255,0.2); margin: 2rem 0;">
            <a href="#" class="nav-item-dash text-danger" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <main class="dash-main" id="mainContent">
        <header class="dash-header">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light d-lg-none" id="sidebarToggle" style="border: 1px solid rgba(0,0,0,0.1);">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="mb-0 fw-bold d-none d-sm-block text-dark" id="pageTitle">Garage Overview</h5>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <div class="text-end d-none d-md-block">
                    <p class="mb-0 fw-bold text-dark fs-6" id="userName">User Name</p>
                    <p class="mb-0 text-muted small text-uppercase fw-bold" style="letter-spacing: 0.5px;">garage</p>
                </div>
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold shadow-sm" style="width: 45px; height: 45px; border: 2px solid #fff;">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </header>

        <iframe id="dashFrame" src="garage-overview.html" title="Dashboard Content"></iframe>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const toggle = document.getElementById('sidebarToggle');
            const links = document.querySelectorAll('.nav-item-dash[data-target]');
            const frame = document.getElementById('dashFrame');
            const pageTitle = document.getElementById('pageTitle');
            
            // Session Check
            const session = JSON.parse(localStorage.getItem('stackly_active_session') || '{}');
            if(!session.name) window.location.href = 'login.html';
            document.getElementById('userName').textContent = session.name;

            // Sidebar Toggle
            toggle.addEventListener('click', () => {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            });
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            });

            // Navigation
            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    links.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    frame.src = link.getAttribute('data-target');
                    pageTitle.textContent = link.querySelector('span').textContent;
                    
                    if(window.innerWidth < 992) {
                        sidebar.classList.remove('active');
                        overlay.classList.remove('active');
                    }
                });
            });

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('stackly_active_session');
                window.location.href = 'login.html';
            });
        });
    </script>
</body>
</html>
