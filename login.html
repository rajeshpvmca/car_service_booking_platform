<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stackly Car Service Platform</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            overflow-x: hidden;
        }
        
        /* Ultra Premium Role Selector */
        .role-btn {
            border: 1px solid rgba(0,0,0,0.08);
            color: #64748b;
            background-color: #f8fafc;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .btn-check:checked + .role-btn {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: #fff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transform: translateY(-2px);
        }
        
        .role-btn:hover:not(.btn-check:checked + .role-btn) {
            background-color: #f1f5f9;
            border-color: rgba(0,0,0,0.15);
        }

        /* Apple Style Input Containers */
        .input-glass {
            background-color: #f8fafc;
            border: 1px solid rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }
        
        .input-glass:focus-within {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body>

    <div class="vh-100 d-flex align-items-center justify-content-center position-relative px-3 py-4 overflow-y-auto">
        <!-- Background Image -->
        <div class="position-fixed w-100 h-100 top-0 start-0" style="background-image: url('https://images.unsplash.com/photo-1493238792000-8113da705763?q=80&w=2000&auto=format&fit=crop'); background-size: cover; background-position: center; z-index: 0;"></div>
        
        <!-- Deep Gradient Overlay -->
        <div class="position-fixed w-100 h-100 top-0 start-0" style="background: linear-gradient(135deg, rgba(15,23,42,0.95) 0%, rgba(37,99,235,0.7) 100%); z-index: 1;"></div>
        
        <!-- Floating Login Card -->
        <div class="bg-white rounded-4 shadow-lg position-relative my-auto w-100" style="max-width: 500px; z-index: 2;">
            
            <!-- Card Header -->
            <div class="p-4 p-md-5 pb-0 text-center">
                <a href="index.html" class="d-inline-block mb-4 text-decoration-none">
                    <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle shadow-sm border" style="width: 65px; height: 65px;">
                        <i class="fas fa-car fa-2x text-gradient"></i>
                    </div>
                </a>
                <h2 class="fw-bold mb-2">Welcome Back</h2>
                <p class="text-muted small px-3">Sign in to your Stackly account to manage your automotive services.</p>
            </div>
            
            <!-- Card Body -->
            <div class="p-4 p-md-5 pt-4">
                <form id="loginForm">
                    <!-- Role Selector -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Select Your Role</label>
                        <div class="d-flex flex-column flex-sm-row gap-2">
                            <div class="flex-fill">
                                <input type="radio" class="btn-check" name="role" id="roleCustomer" value="Customer" autocomplete="off" checked>
                                <label class="btn role-btn rounded-pill py-2 w-100 fw-bold m-0" for="roleCustomer">
                                    <i class="fas fa-user me-1"></i> Customer
                                </label>
                            </div>
                            <div class="flex-fill">
                                <input type="radio" class="btn-check" name="role" id="rolePartner" value="Garage" autocomplete="off">
                                <label class="btn role-btn rounded-pill py-2 w-100 fw-bold m-0" for="rolePartner">
                                    <i class="fas fa-tools me-1"></i> Garage
                                </label>
                            </div>
                            <div class="flex-fill">
                                <input type="radio" class="btn-check" name="role" id="roleAdmin" value="Admin" autocomplete="off">
                                <label class="btn role-btn rounded-pill py-2 w-100 fw-bold m-0" for="roleAdmin">
                                    <i class="fas fa-shield-alt me-1"></i> Admin
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Email -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Email Address</label>
                        <div class="input-glass p-1 rounded-4">
                            <input type="email" id="loginEmail" class="form-control border-0 px-3 py-2 bg-transparent" placeholder="name@stackly.com" required style="box-shadow: none !important; font-size: 1rem;">
                        </div>
                    </div>
                    
                    <!-- Password -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label fw-bold small text-muted text-uppercase mb-0" style="letter-spacing: 1px; font-size: 0.75rem;">Password</label>
                            <a href="#" class="text-decoration-none small text-primary fw-bold" style="font-size: 0.8rem;">Forgot Password?</a>
                        </div>
                        <div class="input-glass p-1 rounded-4 mb-2 position-relative">
                            <input type="password" id="loginPassword" class="form-control border-0 px-3 py-2 bg-transparent pe-5" placeholder="Enter your password" required style="box-shadow: none !important; font-size: 1rem;">
                            <button type="button" class="btn border-0 position-absolute top-50 end-0 translate-middle-y toggle-password text-muted" style="background: transparent;">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <!-- Password Strength Bar (Requested) -->
                        <div class="progress mb-1" style="height: 5px; background-color: rgba(0,0,0,0.05); border-radius: 3px;">
                            <div id="loginStrengthBar" class="progress-bar bg-danger" role="progressbar" style="width: 0%; transition: all 0.3s ease;"></div>
                        </div>
                        <small id="loginStrengthText" class="text-muted d-block text-end" style="font-size: 0.7rem;">Enter password</small>
                    </div>
                    
                    <!-- Remember Me -->
                    <div class="mb-4 form-check ps-0">
                        <div class="d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input mt-0" id="rememberMe" style="width: 18px; height: 18px; border-radius: 4px; border-color: rgba(0,0,0,0.2);">
                            <label class="form-check-label text-muted small" for="rememberMe" style="font-size: 0.85rem;">Remember me for 30 days</label>
                        </div>
                    </div>
                    
                    <!-- Submit -->
                    <button type="submit" class="btn btn-custom w-100 rounded-pill py-3 fw-bold shadow-sm mb-4 mt-2" style="font-size: 1.05rem; transition: transform 0.3s ease;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='translateY(0)'">Sign In to Dashboard <i class="fas fa-arrow-right ms-2"></i></button>
                    
                    <div class="text-center">
                        <p class="text-muted small mb-0">Don't have an account? <a href="signup.html" class="text-primary text-decoration-none fw-bold">Create Account</a></p>
                    </div>
                </form>
            </div>
            
            <!-- Back to Home Banner -->
            <div class="bg-light p-3 text-center border-top">
                <a href="index.html" class="text-muted text-decoration-none small fw-bold"><i class="fas fa-arrow-left me-1"></i> Return to Website</a>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
