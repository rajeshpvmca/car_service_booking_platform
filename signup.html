<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Stackly Car Service Platform</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            overflow-x: hidden;
        }
        
        /* Ultra Premium Role Selector */
        .role-btn {
            border: 1px solid rgba(0,0,0,0.08);
            color: #64748b;
            background-color: #f8fafc;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .btn-check:checked + .role-btn {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: #fff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transform: translateY(-2px);
        }
        
        .role-btn:hover:not(.btn-check:checked + .role-btn) {
            background-color: #f1f5f9;
            border-color: rgba(0,0,0,0.15);
        }

        /* Apple Style Input Containers */
        .input-glass {
            background-color: #f8fafc;
            border: 1px solid rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }
        
        .input-glass:focus-within {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body>

    <div class="vh-100 d-flex align-items-center justify-content-center position-relative px-3 py-4 overflow-y-auto">
        <!-- Background Image -->
        <div class="position-fixed w-100 h-100 top-0 start-0" style="background-image: url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=2000&auto=format&fit=crop'); background-size: cover; background-position: center; z-index: 0;"></div>
        
        <!-- Deep Gradient Overlay -->
        <div class="position-fixed w-100 h-100 top-0 start-0" style="background: linear-gradient(135deg, rgba(15,23,42,0.95) 0%, rgba(37,99,235,0.5) 100%); z-index: 1;"></div>
        
        <!-- Floating Signup Card -->
        <div class="bg-white rounded-4 shadow-lg position-relative my-auto w-100" style="max-width: 600px; z-index: 2;">
            
            <!-- Card Header -->
            <div class="p-4 p-md-5 pb-0 text-center">
                <a href="index.html" class="d-inline-block mb-4 text-decoration-none">
                    <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle shadow-sm border" style="width: 65px; height: 65px;">
                        <i class="fas fa-user-plus fa-2x text-gradient"></i>
                    </div>
                </a>
                <h2 class="fw-bold mb-2">Create an Account</h2>
                <p class="text-muted small px-3">Join the fastest growing car service network.</p>
            </div>
            
            <!-- Card Body -->
            <div class="p-4 p-md-5 pt-4">
                <form id="signupForm">
                    <!-- Role Selector -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">I am signing up as a:</label>
                        <div class="d-flex flex-column flex-sm-row gap-2">
                            <div class="flex-fill">
                                <input type="radio" class="btn-check" name="role" id="roleCustomer" value="Customer" autocomplete="off" checked>
                                <label class="btn role-btn rounded-pill py-2 w-100 fw-bold m-0" for="roleCustomer">
                                    <i class="fas fa-car side me-1"></i> Customer
                                </label>
                            </div>
                            <div class="flex-fill">
                                <input type="radio" class="btn-check" name="role" id="rolePartner" value="Garage" autocomplete="off">
                                <label class="btn role-btn rounded-pill py-2 w-100 fw-bold m-0" for="rolePartner">
                                    <i class="fas fa-tools me-1"></i> Garage
                                </label>
                            </div>
                            <div class="flex-fill">
                                <input type="radio" class="btn-check" name="role" id="roleAdmin" value="Admin" autocomplete="off">
                                <label class="btn role-btn rounded-pill py-2 w-100 fw-bold m-0" for="roleAdmin">
                                    <i class="fas fa-shield-alt me-1"></i> Admin
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row g-3 mb-4">
                        <!-- Full Name -->
                        <div class="col-sm-6">
                            <label class="form-label fw-bold small text-muted text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Full Name</label>
                            <div class="input-glass p-1 rounded-4">
                                <input type="text" class="form-control border-0 px-3 py-2 bg-transparent" id="name" placeholder="John Doe" required style="box-shadow: none !important; font-size: 0.95rem;">
                            </div>
                        </div>
                        
                        <!-- Phone Number -->
                        <div class="col-sm-6">
                            <label class="form-label fw-bold small text-muted text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Phone Number</label>
                            <div class="input-glass p-1 rounded-4">
                                <input type="tel" class="form-control border-0 px-3 py-2 bg-transparent" id="phone" placeholder="+1 (555) 000-0000" required style="box-shadow: none !important; font-size: 0.95rem;">
                            </div>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Email Address</label>
                        <div class="input-glass p-1 rounded-4">
                            <input type="email" class="form-control border-0 px-3 py-2 bg-transparent" id="email" placeholder="name@stackly.com" required style="box-shadow: none !important; font-size: 0.95rem;">
                        </div>
                    </div>
                    
                    <div class="row g-3 mb-4">
                        <!-- Password -->
                        <div class="col-sm-6">
                            <label class="form-label fw-bold small text-muted text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Password</label>
                            <div class="input-glass p-1 rounded-4 mb-2">
                                <input type="password" class="form-control border-0 px-3 py-2 bg-transparent" id="password" placeholder="Create password" required style="box-shadow: none !important; font-size: 0.95rem;">
                            </div>
                            <div class="progress mb-1" style="height: 5px; background-color: rgba(0,0,0,0.05); border-radius: 3px;">
                                <div id="strengthBar" class="progress-bar" role="progressbar" style="width: 0%; transition: all 0.3s ease;"></div>
                            </div>
                            <small id="strengthText" class="text-muted d-block text-end" style="font-size: 0.7rem;">Enter password</small>
                        </div>
                        
                        <!-- Confirm Password -->
                        <div class="col-sm-6">
                            <label class="form-label fw-bold small text-muted text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Confirm Password</label>
                            <div class="input-glass p-1 rounded-4 mb-2">
                                <input type="password" class="form-control border-0 px-3 py-2 bg-transparent" id="confirmPassword" placeholder="Confirm password" required style="box-shadow: none !important; font-size: 0.95rem;">
                            </div>
                            <small id="matchMsg" class="d-block text-end fw-bold" style="font-size: 0.7rem;"></small>
                        </div>
                    </div>
                    
                    <!-- Terms -->
                    <div class="mb-4 form-check ">
                        <div class="d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input mt-0" id="agreeTerms" required style="width: 18px; height: 18px; border-radius: 4px; border-color: rgba(0,0,0,0.2);">
                            <label class="form-check-label text-muted small" for="agreeTerms" style="font-size: 0.85rem;">I agree to the <a href="#" class="text-primary text-decoration-none fw-bold">Terms of Service</a>.</label>
                        </div>
                    </div>
                    
                    <!-- Submit -->
                    <button type="submit" class="btn btn-custom w-100 rounded-pill py-3 fw-bold shadow-sm mb-4 mt-2" style="font-size: 1.05rem; transition: transform 0.3s ease;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='translateY(0)'">Create Account <i class="fas fa-arrow-right ms-2"></i></button>
                    
                    <div class="text-center">
                        <p class="text-muted small mb-0">Already have an account? <a href="login.html" class="text-primary text-decoration-none fw-bold">Sign In</a></p>
                    </div>
                </form>
            </div>
            
            <!-- Back to Home Banner -->
            <div class="bg-light p-3 text-center border-top">
                <a href="index.html" class="text-muted text-decoration-none small fw-bold"><i class="fas fa-arrow-left me-1"></i> Return to Website</a>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
      <script>

        // Live password strength
        const pwdInput = document.getElementById('password');
        const confirmPwd = document.getElementById('confirmPassword');
        const bar = document.getElementById('strengthBar');
        const matchMsg = document.getElementById('matchMsg');
        const strengthText = document.getElementById('strengthText');
        
        const rules = {
            'r-len': v => v.length >= 8,
            'r-upper': v => /[A-Z]/.test(v),
            'r-num': v => /[0-9]/.test(v),
            'r-sym': v => /[^A-Za-z0-9]/.test(v)
        };
        const colors = ['#dc3545', '#fd7e14', '#ffc107', '#10b981']; // Red, Orange, Yellow, Emerald Green
        const labels = ['Weak', 'Fair', 'Good', 'Strong'];
        
        if (pwdInput && bar) {
            pwdInput.addEventListener('input', () => {
                const v = pwdInput.value;
                if (v.length === 0) {
                    bar.style.width = '0%';
                    strengthText.textContent = 'Enter password';
                    strengthText.style.color = 'inherit';
                    checkMatch();
                    return;
                }
                let passed = 0;
                Object.values(rules).forEach(fn => {
                    if (fn(v)) passed++;
                });
                bar.style.width = (passed / 4 * 100) + '%';
                bar.style.setProperty('background-color', colors[passed - 1] || 'transparent', 'important');
                strengthText.textContent = labels[passed - 1] || 'Very Weak';
                strengthText.style.color = colors[passed - 1] || 'inherit';
                checkMatch();
            });
        } confirmPwd.addEventListener('input', checkMatch);

        function checkMatch() {
            if (confirmPwd.value.length > 0) {
                if (pwdInput.value === confirmPwd.value) {
                    matchMsg.style.color = '#10b981';
                    matchMsg.innerHTML = '<i class="fas fa-check-circle me-1"></i>Passwords match';
                } else {
                    matchMsg.style.color = '#dc3545';
                    matchMsg.innerHTML = '<i class="fas fa-times-circle me-1"></i>Passwords do not match';
                }
            } else {
                matchMsg.innerHTML = '';
            }
        }
    </script>
</body>
</html>
